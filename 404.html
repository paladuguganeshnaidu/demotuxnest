<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found - TuxNest Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--header-h) + 24px) 24px 24px;
    }
    .error-content {
      text-align: center;
      max-width: 400px;
    }
    .error-content h1 {
      font-size: 6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 16px;
      font-family: var(--font-mono);
    }
    .error-content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .error-content p {
      color: var(--fg-muted);
      margin-bottom: 24px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <header role="banner">
    <div class="container header-inner">
      <a href="/" class="logo" aria-label="TuxNest Home">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="currentColor"/>
          <path d="M8 12h16M8 16h12M8 20h8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        <span>TuxNest</span>
      </a>
      <nav role="navigation" aria-label="Main navigation">
        <a href="/" class="nav-link">Home</a>
        <a href="https://github.com/paladuguganeshnaidu/tuxnestdesktop-releases" class="nav-link primary" target="_blank" rel="noopener noreferrer">Download</a>
      </nav>
    </div>
  </header>

  <main id="main-content" role="main">
    <div class="container error-page">
      <div class="error-content">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn-primary">← Back to Home</a>
      </div>
    </div>
  </main>

  <footer role="contentinfo">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 TuxNest. Built by <a href="https://github.com/paladuguganeshnaidu" target="_blank" rel="noopener noreferrer">Ganesh Naidu</a>. Open source under MIT license.</p>
      </div>
    </div>
  </footer>
</body>
</html>
